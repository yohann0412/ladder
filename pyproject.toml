[project]
name = "ladder"
version = "0.1.0"
description = "Measure how far up the git -> structural -> LLM resolution ladder agent PR conflicts climb."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.25",
    "tree-sitter-rust>=0.24",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-php>=0.24",
    "tree-sitter-bash>=0.25",
    "tree-sitter-css>=0.25",
    "tree-sitter-html>=0.23",
    "tree-sitter-json>=0.24",
    "tree-sitter-scala>=0.26",
    "matplotlib>=3.9",
    "pyarrow>=18",
]

[project.scripts]
ladder = "ladder.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ladder"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fixtures/recorded"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "D1"]
ignore = ["PLR0913", "PLR2004", "D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"e2e/*" = ["D1", "PLR0915"]
"fixtures/*" = ["D1"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "e2e", "fixtures"]
exclude = ["fixtures/recorded"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["e2e"]
addopts = "-ra"
